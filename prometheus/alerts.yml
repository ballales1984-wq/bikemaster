groups:
  - name: bikemaster-alerts
    rules:
      - alert: HighErrorRate
        expr: sum(rate(bikemaster_http_requests_total{status_code=~"5.."}[5m])) / sum(rate(bikemaster_http_requests_total[5m])) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate"
          description: "Error rate above 5% for more than 2 minutes"

      - alert: SlowResponseTime
        expr: histogram_quantile(0.95, sum(rate(bikemaster_http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Slow HTTP responses"
          description: "95th percentile response time above 2 seconds"

      - alert: LowCacheHitRate
        expr: sum(rate(bikemaster_cache_hits_total[5m])) / (sum(rate(bikemaster_cache_hits_total[5m])) + sum(rate(bikemaster_cache_misses_total[5m]))) * 100 < 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate below 80%"

      - alert: AIServiceDown
        expr: rate(bikemaster_ai_coach_queries_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI Coach not responding"
          description: "No AI queries recorded in the last 5 minutes"