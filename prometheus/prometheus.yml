global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'bikemaster'
    static_configs:
      - targets: ['bikemaster:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'zipkin'
    static_configs:
      - targets: ['zipkin:9411']
    metrics_path: '/metrics'
    scrape_interval: 10s