[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aethermap"
version = "0.1.0"
description = "Cartographic engine (cube-sphere, S2/H3, WebGL, digital twin) — evolution of BikeMaster's map layer"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "BikeMaster"}]
keywords = ["maps", "cartography", "s2", "h3", "geo", "webgl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26.4",
    "h3>=4.0.0",
    "s2geometry>=0.3.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
viewer = ["pygame>=2.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
