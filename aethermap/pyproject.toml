[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aethermap"
version = "0.1.0"
description = "Cartographic engine (cube-sphere, S2/H3, WebGL, digital twin) — evolution of BikeMaster's map layer"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [{name = "BikeMaster"}]
keywords = ["maps", "cartography", "s2", "h3", "geo", "webgl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26.4",
    "h3>=4.0.0",
    "pydantic>=2.0.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
s2 = ["s2sphere>=0.2.5"]
viewer = ["pygame>=2.5.0"]
geo = [
    "osmnx>=1.9.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
]
maps = [
    "aethermap[geo,s2,viewer]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aethermap = ["geo/natural_earth/*.geojson"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
