<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AetherMap — WebGL2 cube-sphere renderer</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c14;overflow:hidden;font-family:monospace}
  canvas{display:block;width:100vw;height:100vh;cursor:grab}
  canvas:active{cursor:grabbing}
  #hud{position:fixed;left:10px;top:10px;color:#7fd;font-size:12px;line-height:1.5;
       background:rgba(0,0,0,.35);padding:8px 10px;border-radius:6px;pointer-events:none}
  #hud b{color:#fff}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <b>AetherMap</b> — WebGL2 cube-sphere (Fase 4)<br />
  trascina per ruotare la camera · resize automatico<br />
  wireframe = cube-sphere · giallo = strada · verde = albero · rosso = montagna
</div>
<script>
/* =========================================================================
   AetherMap — renderer WebGL2 cube-sphere (scopo limitato, NON un motore).
   Principi riusati da aethermap/src/aethermap/render/projection.py:
     - mesh cube-sphere (6 facce, griglia NxN di punti sulla sfera)
     - rotazione camera (yaw/pitch) + proiezione ORTGRAFICA
     - front-face culling (solo z>0, verso la camera) come in project()
   ========================================================================= */

const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", { antialias: true });
if (!gl) { document.body.innerHTML = "<p style='color:#f55;padding:20px'>WebGL2 non disponibile in questo browser.</p>"; throw new Error("no webgl2"); }

/* --- CUBE-SPHERE ENTITY POSITIONS ---------------------------------------
   Posizioni delle entita di esempio ottenute con la stessa matematica di
   core/coordinates.py::geodetic_to_direction(lat,lon):
       d = (cos(lat)cos(lon), cos(lat)sin(lon), sin(lat))   // sfera unitaria
   Le lat/lon sono hardcodate da render/scene.py::Scene.example(). */
const DEG = Math.PI / 180;
function geodeticToDirection(lat, lon) {
  const la = lat * DEG, lo = lon * DEG, cl = Math.cos(la);
  return [cl * Math.cos(lo), cl * Math.sin(lo), Math.sin(la)];
}
const EARTH_R = 6371000.0; // usato solo per alzare la montagna (alt/scala)

/* --- CAMERA-RELATIVE float32 --------------------------------------------
   In ECEF reale le coordinate sono ~6.37e6 m: in float32 (24 bit mantissa)
   la precisione crolla a ~0.5 m, facendo "tremare" la geometria vicino alla
   camera. Qui sottraiamo l'ORIGINE = centro della sfera (= target camera),
   quindi ogni vertice e' espresso in coordinate CAMERA-RELATIVE O(1).
   Nel motore completo si sottrae il centro del tile/telecamera attiva, cosi'
   l'errore float32 resta sub-centimetrico qualunque sia la scala del pianeta.
   (vedi Fase 1 §6.2 e phase-4-rendering-design.md §2.1)                     */
function cameraRelative(p) {
  // origine = [0,0,0] (centro sfera = target camera): resta gia' O(1)
  return [p[0], p[1], p[2]];
}

/* --- SHADERS ------------------------------------------------------------
   La proiezione e' ORTGRAFICA: scartiamo la profondita' (z) per lo schermo
   e usiamo solo x,y scalati in clip-space. Il front-face culling su z>0
   nasconde la meta' posteriore della sfera (uguale a project() in projection.py). */
const VS = `#version 300 es
in vec3 p;
uniform mat3 rot;        // rotazione camera (R * P)
uniform vec2 scale;      // proiezione ortografica (clip-space)
uniform float pointSize;
out float facing;
void main() {
  vec3 r = rot * p;
  facing = r.z;
  if (r.z <= 0.0) {                 // front-face cull: solo z>0 (verso camera)
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);  // fuori dal volume di clip
    return;
  }
  gl_Position = vec4(r.x * scale.x, r.y * scale.y, 0.0, 1.0);
  gl_PointSize = pointSize;
}`;
const FS = `#version 300 es
precision mediump float;
in float facing;
uniform vec3 color;
out vec4 outColor;
void main() {
  // sfumatura verso il bordo per dare un minimo di senso di profondita'
  float sh = clamp(0.55 + facing * 0.45, 0.0, 1.0);
  outColor = vec4(color * sh, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const U = {
  rot: gl.getUniformLocation(prog, "rot"),
  scale: gl.getUniformLocation(prog, "scale"),
  pointSize: gl.getUniformLocation(prog, "pointSize"),
  color: gl.getUniformLocation(prog, "color"),
};
const A_p = gl.getAttribLocation(prog, "p");

/* --- CUBE-SPHERE MESH (wireframe LINES) ---------------------------------
   Stessa topologia di projection.cube_sphere_mesh(): 6 facce, per ogni faccia
   una griglia NxN di punti proiettati sulla sfera unitaria. Gli spigoli della
   griglia diventano segmenti LINES. */
const N = 16;
const wire = [];
function faceDir(f, u, v) {
  let d;
  if (f === 0) d = [1, u, v];
  else if (f === 1) d = [-1, u, v];
  else if (f === 2) d = [u, 1, v];
  else if (f === 3) d = [u, -1, v];
  else if (f === 4) d = [u, v, 1];
  else d = [u, v, -1];
  const n = Math.hypot(d[0], d[1], d[2]);   // normalizza -> punto sulla sfera
  return [d[0] / n, d[1] / n, d[2] / n];
}
const grid = []; // grid[f][i][j] = punto normalizzato
for (let f = 0; f < 6; f++) {
  grid[f] = [];
  for (let i = 0; i <= N; i++) {
    grid[f][i] = [];
    for (let j = 0; j <= N; j++) {
      const u = (i / N) * 2 - 1, v = (j / N) * 2 - 1;
      const p = cameraRelative(faceDir(f, u, v));
      grid[f][i][j] = p;
    }
  }
}
for (let f = 0; f < 6; f++) {
  for (let i = 0; i <= N; i++) {
    for (let j = 0; j <= N; j++) {
      if (i < N) wire.push(...grid[f][i][j], ...grid[f][i + 1][j]);   // spigolo +u
      if (j < N) wire.push(...grid[f][i][j], ...grid[f][i][j + 1]);   // spigolo +v
    }
  }
}

/* --- ENTITA DI ESEMPIO (da scene.py) -------------------------------------
   road:    LINE_STRIP su 3 lat/lon  -> si appoggia sulla superficie
   tree:    POINT ad alta quota 0     -> punto verde
   mountain:POINT con alt=8000 m     -> raggio = 1 + alt/EARTH_R (rosso)   */
const road = [];
for (const [lat, lon] of [[45.0, 9.0], [45.01, 9.02], [45.02, 9.04]]) {
  road.push(...cameraRelative(geodeticToDirection(lat, lon)));
}
const tree = cameraRelative(geodeticToDirection(45.005, 9.01));
const mountainDir = geodeticToDirection(45.015, 9.03);
const mountainR = 1.0 + 8000.0 / EARTH_R;
const mountain = [
  mountainDir[0] * mountainR, mountainDir[1] * mountainR, mountainDir[2] * mountainR,
];

/* --- SKIRTS / CLIPMAP (accenno, NON implementato) ------------------------
   Anti-cracking tra tile a LOD diverso: si attaccherebbero qui ai BORDI
   delle tile del quadtree (ogni faccia del cube-sphere e' suddivisa in tile).
   Uno "skirt" e' una falda verticale di altezza h generata sull'boundary di
   ogni tile; le falde di tile adiacenti si sovrappongono e nascondono il
   varco (cracking) senza modificare la topologia. Nel cube-sphere qui sopra i
   bordi sono le linee i==0/i==N e j==0/j==N di ogni faccia; un motore reale
   generherebbe gli skirt in uno shader dedicato per faccia/tile. Idem la
   "clipmap" centrata sulla camera per il terreno ad alta risoluzione.        */

/* --- GPU BUFFERS -------------------------------------------------------- */
function makeBuffer(arr, mode) {
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.STATIC_DRAW);
  return { buf: b, count: arr.length / 3, mode };
}
const BUF = {
  wire: makeBuffer(wire, gl.LINES),
  road: makeBuffer(road, gl.LINE_STRIP),
  tree: makeBuffer(tree, gl.POINTS),
  mountain: makeBuffer(mountain, gl.POINTS),
};

/* --- CAMERA / INTERAZIONE ----------------------------------------------- */
let yaw = 0.6, pitch = 0.35;
let dragging = false, lx = 0, ly = 0;
canvas.addEventListener("pointerdown", e => { dragging = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointerup", () => dragging = false);
canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  yaw += (e.clientX - lx) * 0.005;
  pitch += (e.clientY - ly) * 0.005;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));
  lx = e.clientX; ly = e.clientY;
});

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
}
addEventListener("resize", resize);
resize();

/* matrice rotazione combinata rot = R(yaw) * P(pitch), colonna-per-colonna
   (uguale a projection.rotate: m = R @ P). */
function rotationMatrix() {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  // colonne di m = R * P
  const c0 = [cy, 0, -sy];
  const c1 = [sy * sp, cp, cy * sp];
  const c2 = [sy * cp, -sp, cy * cp];
  return new Float32Array([...c0, ...c1, ...c2]);
}

function draw(buf, color, size) {
  gl.bindBuffer(gl.ARRAY_BUFFER, buf.buf);
  gl.enableVertexAttribArray(A_p);
  gl.vertexAttribPointer(A_p, 3, gl.FLOAT, false, 0, 0);
  gl.uniform3fv(U.color, color);
  gl.uniform1f(U.pointSize, size);
  gl.drawArrays(buf.mode, 0, buf.count);
}

function frame() {
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.04, 0.05, 0.08, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  // proiezione ortografica: scala clip-space (sfera raggio 1 -> 0.85)
  const s = 0.85;
  gl.uniformMatrix3fv(U.rot, false, rotationMatrix());
  gl.uniform2f(U.scale, s, s);

  draw(BUF.wire, [0.30, 0.55, 0.85], 1.0);   // cube-sphere wireframe
  draw(BUF.road, [0.95, 0.85, 0.25], 3.0);   // strada (linea)
  draw(BUF.tree, [0.35, 0.95, 0.45], 9.0);   // albero (punto)
  draw(BUF.mountain, [0.95, 0.35, 0.30], 11.0); // montagna (punto alto)

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
