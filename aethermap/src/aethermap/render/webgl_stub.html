<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AetherMap — WebGL2 cube-sphere renderer (Fase 4)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c14;overflow:hidden;font-family:monospace}
  canvas#gl{display:block;width:100vw;height:100vh;cursor:grab;position:fixed;left:0;top:0;z-index:0}
  canvas:active{cursor:grabbing}
  #lbl{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:1}
  #hud{position:fixed;left:10px;top:10px;color:#7fd;font-size:12px;line-height:1.5;
       background:rgba(0,0,0,.35);padding:8px 10px;border-radius:6px;z-index:2}
  #hud b{color:#fff}
  #detail{z-index:3}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="lbl"></canvas>
  <div id="hud">
    <b>AetherMap</b> — WebGL2 cube-sphere (Fase 4)<br />
    drag: ruota · scroll: zoom · D: reset<br />
    <span id="fps">--</span> FPS &middot; entita': <span id="ent-count">0</span> &middot; relazioni: <span id="rel-count">0</span><br />
    <button id="dem-btn" style="background:#7fd;color:#000;border:none;padding:2px 8px;cursor:pointer;font-family:monospace">DEM</button>
    <span id="dem"></span><br />
    <span id="hover"></span>
    <span id="selection"></span><br />
    S2 grid: <span id="s2-status">off</span> &middot; entita visibili: <span id="vis-count">0</span>
  </div>
  <div id="detail" style="display:none; position:fixed; right:10px; top:10px; width:260px; max-height:70vh; overflow:auto; background:rgba(0,0,0,.75); color:#fff; padding:10px; border-radius:6px; font-family:monospace; font-size:11px; line-height:1.4; pointer-events:auto;">
    <b id="detail-title"></b>
    <pre id="detail-body" style="white-space:pre-wrap; word-break:break-all;"></pre>
  </div>

<script>
(async function() {
  "use strict";
  document.getElementById("ent-count").textContent = "?";

  const DEG = Math.PI / 180;
  const EARTH_R = 6371000.0;
  const canvas = document.getElementById("gl");
  const gl = canvas.getContext("webgl2", { antialias: true });
  if (!gl) {
    document.body.innerHTML = "<p style='color:#f55;padding:20px'>WebGL2 non disponibile in questo browser.</p>";
    throw new Error("no webgl2");
  }
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  /* =========================================================================
     SHADERS
     ========================================================================= */

  const TERRAIN_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNorm;
uniform mat3 uRot;
uniform float uScale;
uniform float uZoom;
out vec3 vNormal;
out float vFacing;
void main() {
  vec3 r = uRot * aPos;
  vNormal = uRot * aNorm;
  vFacing = r.z;
  gl_Position = vec4(r.x * uScale / uZoom, r.y * uScale / uZoom, 0.0, 1.0);
}`;

  const TERRAIN_FS = `#version 300 es
precision highp float;
in vec3 vNormal;
in float vFacing;
uniform vec3 uLightDir;
uniform vec3 uAtmColor;
out vec4 outColor;
void main() {
  vec3 n = normalize(vNormal);
  float diff = max(dot(n, uLightDir), 0.0);
  float light = 0.25 + 0.75 * diff;
  float sh = clamp(0.6 + 0.4 * vFacing, 0.0, 1.0);
  float rim = 1.0 - abs(vFacing);
  vec3 base = mix(vec3(0.12,0.20,0.09), vec3(0.28,0.42,0.18), diff);
  vec3 col = mix(base, uAtmColor, rim * rim * 0.5);
  outColor = vec4(col * light * sh, 1.0);
}`;

  const ENTITY_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
uniform mat3 uRot;
uniform float uScale;
uniform float uZoom;
uniform float uGlow;
out float vFacing;
out vec3 vWorldPos;
void main() {
  vec3 scaled = aPos * (1.0 + uGlow * 0.6);
  vec3 r = uRot * scaled;
  vFacing = r.z;
  vWorldPos = r;
  if (r.z <= 0.0) { gl_Position = vec4(2,2,2,1); return; }
  gl_Position = vec4(r.x * uScale / uZoom, r.y * uScale / uZoom, 0.0, 1.0);
}`;

  const ENTITY_FS = `#version 300 es
precision highp float;
in float vFacing;
in vec3 vWorldPos;
uniform vec3 uColor;
out vec4 outColor;
void main() {
  vec3 n = normalize(cross(dFdx(vWorldPos), dFdy(vWorldPos)));
  float sh = clamp(0.5 + 0.5 * vFacing, 0.0, 1.0);
  vec3 l = normalize(vec3(0.3, 0.5, 0.85));
  float diff = max(dot(n, l), 0.0);
  vec3 h = normalize(l + vec3(0.0, 0.0, 1.0));
  float spec = pow(max(dot(n, h), 0.0), 48.0);
  vec3 col = uColor * (0.25 + 0.65 * diff + 0.3 * spec) * sh;
  outColor = vec4(col, 1.0);
}`;

  const LINE_VS = ENTITY_VS;
  const LINE_FS = `#version 300 es
precision highp float;
in float vFacing;
uniform vec3 uColor;
out vec4 outColor;
void main() {
  float sh = clamp(0.5 + 0.5 * vFacing, 0.0, 1.0);
  outColor = vec4(uColor * sh, 1.0);
}`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function linkProg(vsSrc, fsSrc) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
      throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  const terrainProg = linkProg(TERRAIN_VS, TERRAIN_FS);
  const entityProg  = linkProg(ENTITY_VS,  ENTITY_FS);
  const lineProg    = linkProg(LINE_VS,    LINE_FS);

  const U = {};
  [["terrain", terrainProg, ["uRot","uScale","uZoom","uLightDir","uFog","uAtmColor"]],
   ["entity",  entityProg,  ["uRot","uScale","uZoom","uColor","uGlow"]],
   ["line",    lineProg,    ["uRot","uScale","uZoom","uColor"]]
   ].forEach(([name, prog, uniforms]) => {
     U[name] = {};
     uniforms.forEach(u => { U[name][u] = gl.getUniformLocation(prog, u); });
   });

   function useProg(prog) {
     gl.useProgram(prog);
   }

   /* =========================================================================
      WORLD DATA (caricato da world_data.json)
      ========================================================================= */
   function updateTerrainBuffers() {
    const tMesh = worldData.terrain;
    gl.bindBuffer(gl.ARRAY_BUFFER, terrainPosBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(tMesh.positions), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, terrainNormBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(tMesh.normals), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, terrainIdxBuf);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(tMesh.indices), gl.STATIC_DRAW);
  }

  document.getElementById("dem-btn").addEventListener("click", async () => {
     try {
       demEl.textContent = " · DEM: loading...";
       const faces = [];
       for (let f = 0; f < 6; f++) {
         const r = await fetch(`/api/v1/aethermap/terrain-tile?face=${f}&resolution=${currentLod || 64}`);
         if (!r.ok) throw new Error("HTTP " + r.status);
         faces.push(await r.json());
       }
       if (faces.length === 6) {
         const merged = mergeTerrainParts(faces);
         worldData.terrain = merged.terrain;
         worldData.dem_source = faces[0].source || "backend-dem";
         updateTerrainBuffers();
         demEl.textContent = ` · DEM: ${worldData.dem_source}`;
       }
     } catch(e) {
       demEl.textContent = " · DEM: procedural";
     }
   });

  async function loadWorld() {
     try {
       const resp = await fetch("/api/v1/aethermap/world");
       if (!resp.ok) throw new Error("HTTP " + resp.status);
       return await resp.json();
     } catch(e) {
       try {
         const resp2 = await fetch("/api/world");
         if (!resp2.ok) throw new Error("HTTP " + resp2.status);
         return await resp2.json();
       } catch(e2) {
         try {
           const resp3 = await fetch("world_data.json");
           if (!resp3.ok) throw new Error("HTTP " + resp3.status);
           return await resp3.json();
         } catch(e3) {
           document.body.innerHTML +=
             "<p style='color:#f55;padding:20px'>Impossibile caricare i dati del mondo: " + e3.message + "<br/>Esegui: python -m aethermap.render.webgl_exporter</p>";
           throw e3;
         }
       }
     }
   }
  const DEF_YAW = 0.6, DEF_PITCH = 0.35, DEF_ZOOM = 2.5;
  let yaw = DEF_YAW, pitch = DEF_PITCH, zoom = DEF_ZOOM;
  let tyaw = yaw, tpitch = pitch, tzoom = zoom;
  let dragging = false, lx = 0, ly = 0;
  let wireframe = false;
  let mouseX = -1, mouseY = -1;
  let hoveredId = null;
  let selectedId = null;
  let s2Grid = false;

  let worldData = await loadWorld();
  if (worldData.camera) {
    yaw = worldData.camera.yaw;
    pitch = worldData.camera.pitch;
    zoom = worldData.camera.distance;
    tyaw = yaw; tpitch = pitch; tzoom = zoom;
  }
  function entityLodMinS2(zoom) {
    if (zoom < 1.0) return 4;
    if (zoom < 2.0) return 6;
    if (zoom < 4.0) return 8;
    return 0;
  }

  function visibleEntities(entities, zoom) {
    const minLen = entityLodMinS2(zoom);
    if (minLen === 0) return entities;
    return entities.filter(e => !e.s2 || e.s2.length >= minLen);
  }

  const visEntities = visibleEntities(worldData.entities || [], zoom);
  document.getElementById("ent-count").textContent = (worldData.entities || []).length;
  const visCountEl = document.getElementById("vis-count");
  if (visCountEl) visCountEl.textContent = visEntities.length;
  const relCount = (worldData.relations || []).length;
  const relEl = document.getElementById("rel-count");
  if (relEl) relEl.textContent = relCount;
  const demEl = document.getElementById("dem");
  if (demEl) {
    const src = worldData.dem_source || (worldData.terrain && worldData.terrain.source) || "procedurale";
    demEl.textContent = src !== "procedurale" ? ` · DEM: ${src}` : " · FBM";
  }

  async function loadTerrainTile(face, resolution) {
    try {
      const r = await fetch(`/api/terrain-tile?face=${face}&resolution=${resolution}`);
      if (!r.ok) return null;
      return await r.json();
    } catch(e) {
      return null;
    }
  }

  function lodResolution(zoom) {
    if (zoom < 1.2) return 128;
    if (zoom < 2.0) return 64;
    if (zoom < 4.0) return 32;
    return 16;
  }

  let currentLod = null;
  let lastLodUpdate = 0;
  let lastVisCount = 0;

  async function updateTerrainLod() {
    const now = performance.now();
    if (now - lastLodUpdate < 200) return;
    lastLodUpdate = now;
    const res = lodResolution(zoom);
    if (currentLod === res) return;
    currentLod = res;
    const parts = [];
    const sources = [];
    for (let f = 0; f < 6; f++) {
      const tile = await loadTerrainTile(f, res);
      if (tile && tile.terrain) {
        parts.push(tile.terrain);
        sources.push(tile.dem_source);
      }
    }
    if (parts.length === 6) {
      const merged = mergeTerrainParts(parts);
      worldData.terrain = merged.terrain;
      worldData.dem_source = sources[0] || "backend-dem";
      updateTerrainBuffers();
      if (demEl) demEl.textContent = ` · DEM: LOD${res}`;
    }
  }

  function mergeTerrainParts(parts) {
    const positions = [];
    const normals = [];
    const indices = [];
    for (const p of parts) {
      const base = positions.length;
      for (const pos of p.positions) positions.push(pos);
      for (const nrm of p.normals) normals.push(nrm);
      for (const idx of p.indices) indices.push(base + idx);
    }
    return {
      terrain: {
        positions,
        normals,
        indices,
        source: parts[0].dem_source || "procedurale",
      }
    };
  }

  /* =========================================================================
     TERRAIN BUFFERS
     ========================================================================= */
  const tMesh = worldData.terrain;

  const terrainPosBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, terrainPosBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(tMesh.positions), gl.STATIC_DRAW);

  const terrainNormBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, terrainNormBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(tMesh.normals), gl.STATIC_DRAW);

  const terrainIdxBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, terrainIdxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(tMesh.indices), gl.STATIC_DRAW);
  const terrainIdxCount = tMesh.indices.length;

  /* =========================================================================
     ENTITY BUFFERS
     ========================================================================= */
  const entDrawCalls = [];

  (worldData.entities || []).forEach(ent => {
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);

    if (ent.kind === "line") {
      const flat = [];
      for (const p of ent.points) flat.push(p[0], p[1], p[2]);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(flat), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
        entDrawCalls.push({
          vao, count: ent.points.length,
          color: ent.color || [0.95, 0.78, 0.22], mode: gl.LINE_STRIP,
          prog: lineProg, u: U.line,
          _entId: ent.id,
          _entS2: ent.s2
        });
    } else {
      const r = ent.radius || 1.0;
      const phi = (1 + Math.sqrt(5)) / 2;
      let verts = [
        [-1,phi,0],[1,phi,0],[-1,-phi,0],[1,-phi,0],
        [0,-1,phi],[0,1,phi],[0,-1,-phi],[0,1,-phi],
        [phi,0,-1],[phi,0,1],[-phi,0,-1],[-phi,0,1]
      ].map(v => {
        const l = Math.hypot(v[0],v[1],v[2]);
        return [v[0]/l*r, v[1]/l*r, v[2]/l*r];
      });
      for (let s = 0; s < 2; s++) {
        const next = [];
        for (let i = 0; i < verts.length; i++) {
          const a = verts[i];
          const b = verts[(i+1) % verts.length];
          next.push(a);
          next.push([(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2]);
        }
        verts = next;
      }
      const posArr = new Float32Array(verts.length * 3);
      for (let i = 0; i < verts.length; i++) {
        posArr[i*3]=verts[i][0]; posArr[i*3+1]=verts[i][1]; posArr[i*3+2]=verts[i][2];
      }
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, posArr, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
        entDrawCalls.push({
          vao, count: verts.length,
          color: ent.color || [0.95, 0.78, 0.22], mode: gl.TRIANGLES,
          prog: entityProg, u: U.entity,
          _entId: ent.id,
          _entS2: ent.s2
        });
    }
    gl.bindVertexArray(null);
  });

    /* =========================================================================
       CAMERA
       ========================================================================= */
     const ATM_COLOR = [0.35, 0.55, 0.95];

    canvas.addEventListener("pointerdown", e => {
      dragging = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointerup",   () => dragging = false);
    canvas.addEventListener("pointerleave",() => { dragging = false; mouseX = -1; mouseY = -1; hoveredId = null; });
    canvas.addEventListener("pointermove", e => {
      const rect = canvas.getBoundingClientRect();
      mouseX = e.clientX - rect.left; mouseY = e.clientY - rect.top;
      if (!dragging) return;
      yaw += (e.clientX - lx) * 0.005;
      pitch += (e.clientY - ly) * 0.005;
      pitch = Math.max(-1.4, Math.min(1.4, pitch));
      lx = e.clientX; ly = e.clientY;
    });
    canvas.addEventListener("wheel", e => {
      zoom *= e.deltaY > 0 ? 1.08 : 0.93;
      zoom = Math.max(0.5, Math.min(10.0, zoom));
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener("click", e => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      let best = null;
      let bestDist = 20;
      const minS2 = entityLodMinS2(zoom);
      for (const ent of worldData.entities) {
        if (minS2 > 0 && ent.s2 && ent.s2.length < minS2) continue;
        const p = ent.position;
        if (!p) continue;
        const rx = curRot[0]*p[0] + curRot[1]*p[1] + curRot[2]*p[2];
        const ry = curRot[3]*p[0] + curRot[4]*p[1] + curRot[5]*p[2];
        const rz = curRot[6]*p[0] + curRot[7]*p[1] + curRot[8]*p[2];
        if (rz <= 0) continue;
        const sx = (rx * 0.85 / zoom + 1) * 0.5 * (canvas.width / (window.devicePixelRatio || 1));
        const sy = (1 - (ry * 0.85 / zoom + 1) * 0.5) * (canvas.height / (window.devicePixelRatio || 1));
        const d = Math.hypot(mx - sx, my - sy);
        if (d < bestDist) {
          bestDist = d;
          best = ent;
        }
      }
      selectedId = best ? best.id : null;
      updateDetailPanel();
    });
    addEventListener("keydown", e => {
      if (e.key === "d" || e.key === "D") { tyaw = DEF_YAW; tpitch = DEF_PITCH; tzoom = DEF_ZOOM; }
      if (e.key === "f" || e.key === "F") wireframe = !wireframe;
      if (e.key === "g" || e.key === "G") { s2Grid = !s2Grid; updateHud(); }
    });

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    const lbl = document.getElementById("lbl");
    if (lbl) {
      lbl.width = canvas.width;
      lbl.height = canvas.height;
    }
  }
  addEventListener("resize", resize);
  resize();

  function rotMat() {
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    return new Float32Array([cy,0,-sy, sy*sp,cp,cy*sp, sy*cp,-sp,cy*cp]);
  }

  /* =========================================================================
     HUD / LABELS
     ========================================================================= */
  let curRot = new Float32Array(9);

  function drawLabels() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = canvas.width / dpr;
    const ch = canvas.height / dpr;
    const ctx = document.getElementById("lbl").getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.font = "11px monospace";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";

    let bestDist = 24;
    hoveredId = null;
    const minS2 = entityLodMinS2(zoom);

    for (const ent of worldData.entities) {
      if (minS2 > 0 && ent.s2 && ent.s2.length < minS2) continue;
      const p = ent.position;
      if (!p) continue;
      const rx = curRot[0]*p[0] + curRot[1]*p[1] + curRot[2]*p[2];
      const ry = curRot[3]*p[0] + curRot[4]*p[1] + curRot[5]*p[2];
      const rz = curRot[6]*p[0] + curRot[7]*p[1] + curRot[8]*p[2];
      if (rz <= 0) continue;
      const sx = (rx * 0.85 / zoom + 1) * 0.5 * cw;
      const sy = (1 - (ry * 0.85 / zoom + 1) * 0.5) * ch;
      const name = String(ent.id || "");
      if (!name) continue;

      ctx.fillStyle = "#fff8";
      ctx.fillText(name, sx + 6, sy);

      const dx = mouseX - sx;
      const dy = mouseY - sy;
      if (Math.hypot(dx, dy) < bestDist) {
        bestDist = Math.hypot(dx, dy);
        hoveredId = ent.id;
      }
    }

    if (hoveredId) {
      const ent = worldData.entities.find(e => e.id === hoveredId);
      ctx.fillStyle = "#fff";
      ctx.fillText(hoveredId, mouseX + 14, mouseY - 6);
      if (ent && ent.props) {
        ctx.font = "10px monospace";
        ctx.fillStyle = "#aaac";
        const parts = [];
        for (const [k, v] of Object.entries(ent.props)) {
          parts.push(`${k}=${v}`);
        }
        ctx.fillText(parts.join(" · "), mouseX + 14, mouseY + 10);
      }
    }
  }

  function updateDetailPanel() {
    const detail = document.getElementById("detail");
    if (!detail) return;
    if (selectedId) {
      const ent = worldData.entities.find(e => e.id === selectedId);
      if (ent) {
        document.getElementById("detail-title").textContent = ent.id;
        const lines = [
          `tipo: ${ent.tipo}`,
          `position: [${(ent.position || []).map(v => (v ?? 0).toFixed(4)).join(", ")}]`,
        ];
        if (ent.props) {
          for (const [k, v] of Object.entries(ent.props)) {
            lines.push(`${k}: ${v}`);
          }
        }
        if (ent.points) {
          lines.push(`points: ${ent.points.length}`);
        }
        const rels = (worldData.relations || []).filter(r => r.from === ent.id || r.to === ent.id);
        if (rels.length) {
          lines.push("relazioni:");
          for (const rel of rels) {
            const other = rel.from === ent.id ? rel.to : rel.from;
            lines.push(`  ${other} (${rel.tipo}, peso=${rel.peso})`);
          }
        }
        document.getElementById("detail-body").textContent = lines.join("\n");
        detail.style.display = "block";
        return;
      }
    }
    detail.style.display = "none";
  }

  function drawRelations() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = canvas.width / dpr;
    const ch = canvas.height / dpr;
    const ctx = document.getElementById("lbl").getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = 1;
    const minS2 = entityLodMinS2(zoom);
    const visMap = new Map();
    for (const e of worldData.entities || []) {
      if (minS2 > 0 && e.s2 && e.s2.length < minS2) continue;
      visMap.set(e.id, e);
    }
    for (const rel of (worldData.relations || [])) {
      const a = visMap.get(rel.from);
      const b = visMap.get(rel.to);
      if (!a || !b || !a.position || !b.position) continue;
      const pa = project(a.position, rot, zoom, cw, ch);
      const pb = project(b.position, rot, zoom, cw, ch);
      if (!pa || !pb) continue;
      ctx.beginPath();
      ctx.moveTo(pa.sx, pa.sy);
      ctx.lineTo(pb.sx, pb.sy);
      ctx.stroke();
    }
  }

  function s2GridSpacing(zoom) {
    if (zoom < 1.0) return 30;
    if (zoom < 2.0) return 15;
    return 10;
  }

  function spherePoint(lat, lon) {
    const la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
    return [
      Math.cos(la) * Math.cos(lo),
      Math.cos(la) * Math.sin(lo),
      Math.sin(la)
    ];
  }

  function drawS2Grid() {
    if (!s2Grid) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = canvas.width / dpr;
    const ch = canvas.height / dpr;
    const ctx = document.getElementById("lbl").getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.strokeStyle = "rgba(127,255,221,0.18)";
    ctx.lineWidth = 1;
    const step = s2GridSpacing(zoom);
    for (let lat = -90 + step; lat < 90; lat += step) {
      ctx.beginPath();
      let first = true;
      for (let lon = -180; lon <= 180; lon += 2) {
        const p = spherePoint(lat, lon);
        const pr = project(p, rot, zoom, cw, ch);
        if (!pr) { first = true; continue; }
        if (first) { ctx.moveTo(pr.sx, pr.sy); first = false; }
        else ctx.lineTo(pr.sx, pr.sy);
      }
      ctx.stroke();
    }
    for (let lon = -180 + step; lon < 180; lon += step) {
      ctx.beginPath();
      let first = true;
      for (let lat = -90; lat <= 90; lat += 2) {
        const p = spherePoint(lat, lon);
        const pr = project(p, rot, zoom, cw, ch);
        if (!pr) { first = true; continue; }
        if (first) { ctx.moveTo(pr.sx, pr.sy); first = false; }
        else ctx.lineTo(pr.sx, pr.sy);
      }
      ctx.stroke();
    }
  }

  function updateHud() {
    const s2El = document.getElementById("s2-status");
    if (s2El) s2El.textContent = s2Grid ? "on" : "off";
  }

  function project(p, rot, zoom, cw, ch) {
    const rx = rot[0]*p[0] + rot[1]*p[1] + rot[2]*p[2];
    const ry = rot[3]*p[0] + rot[4]*p[1] + rot[5]*p[2];
    const rz = rot[6]*p[0] + rot[7]*p[1] + rot[8]*p[2];
    if (rz <= 0) return null;
    return {
      sx: (rx * 0.85 / zoom + 1) * 0.5 * cw,
      sy: (1 - (ry * 0.85 / zoom + 1) * 0.5) * ch,
    };
  }

  /* =========================================================================
     RENDER LOOP
     ========================================================================= */
  const lightDir = (() => {
    const l = Math.hypot(0.3,0.5,0.85);
    return [0.3/l, 0.5/l, 0.85/l];
  })();

  let lastT = performance.now(), frames = 0;

  function frame(now) {
    frames++;
    if (now - lastT >= 1000) {
      document.getElementById("fps").textContent = Math.round(frames * 1000 / (now - lastT));
      frames = 0; lastT = now;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.02, 0.03, 0.06, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    yaw += (tyaw - yaw) * 0.1;
    pitch += (tpitch - pitch) * 0.1;
    zoom *= (tzoom / zoom) ** 0.1;

    updateTerrainLod();

    const rot = rotMat();
    curRot = rot;
    const s = 0.85;

    useProg(terrainProg);
    gl.uniformMatrix3fv(U.terrain.uRot, false, rot);
    gl.uniform1f(U.terrain.uScale, s);
    gl.uniform1f(U.terrain.uZoom, zoom);
    gl.uniform3fv(U.terrain.uLightDir, lightDir);
    gl.uniform3fv(U.terrain.uAtmColor, ATM_COLOR);
    gl.uniform3fv(U.terrain.uFog, [0.02, 0.03, 0.06]);
    gl.bindVertexArray(null);
    gl.bindBuffer(gl.ARRAY_BUFFER, terrainPosBuf);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, terrainNormBuf);
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, terrainIdxBuf);
    if (wireframe) {
      for (let i = 0; i < terrainIdxCount; i += 3) {
        gl.drawElements(gl.LINE_LOOP, 3, gl.UNSIGNED_INT, i * 4);
      }
    } else if (terrainIdxCount > 0) {
      gl.drawElements(gl.TRIANGLES, terrainIdxCount, gl.UNSIGNED_INT, 0);
    }
    gl.disableVertexAttribArray(1);

    console.debug('terrain draw', terrainIdxCount, 'indices');

    entDrawCalls.forEach(dc => {
      const minLen = entityLodMinS2(zoom);
      if (minLen > 0 && dc._entS2 && dc._entS2.length < minLen) return;
      useProg(dc.prog);
      gl.uniformMatrix3fv(dc.u.uRot, false, rot);
      gl.uniform1f(dc.u.uScale, s);
      gl.uniform1f(dc.u.uZoom, zoom);
      if (dc.u.uColor) gl.uniform3fv(dc.u.uColor, dc.color);
      if (dc.u.uGlow) {
        const isHover = (hoveredId !== null && dc._entId === hoveredId);
        gl.uniform1f(dc.u.uGlow, isHover ? 0.55 : 0.0);
      }
      gl.bindVertexArray(dc.vao);
      gl.drawArrays(dc.mode, 0, dc.count);
    });

    let visCount = 0;
    for (const dc of entDrawCalls) {
      const minLen = entityLodMinS2(zoom);
      if (minLen > 0 && dc._entS2 && dc._entS2.length < minLen) continue;
      visCount++;
    }
    const visEl = document.getElementById("vis-count");
    if (visEl) visEl.textContent = visCount;

    drawS2Grid();
    drawLabels();
    drawRelations();
    gl.bindVertexArray(null);
    requestAnimationFrame(frame);
  }

  if (terrainIdxCount > 0) {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
