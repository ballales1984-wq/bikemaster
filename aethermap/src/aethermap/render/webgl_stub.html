<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AetherMap — WebGL2 cube-sphere renderer (Fase 4)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c14;overflow:hidden;font-family:monospace}
  canvas{display:block;width:100vw;height:100vh;cursor:grab}
  canvas:active{cursor:grabbing}
  #hud{position:fixed;left:10px;top:10px;color:#7fd;font-size:12px;line-height:1.5;
       background:rgba(0,0,0,.35);padding:8px 10px;border-radius:6px;pointer-events:none;max-width:320px}
  #hud b{color:#fff}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <b>AetherMap</b> — WebGL2 cube-sphere (Fase 4)<br />
  trascina per ruotare · rotella zoom ·<br />
  <span id="fps">--</span> FPS &middot; entita': <span id="ent-count">0</span>
</div>

<script>
(async function() {
  "use strict";
  document.getElementById("ent-count").textContent = "?";

  const DEG = Math.PI / 180;
  const EARTH_R = 6371000.0;
  const canvas = document.getElementById("gl");
  const gl = canvas.getContext("webgl2", { antialias: true });
  if (!gl) {
    document.body.innerHTML = "<p style='color:#f55;padding:20px'>WebGL2 non disponibile in questo browser.</p>";
    throw new Error("no webgl2");
  }
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  /* =========================================================================
     SHADERS
     ========================================================================= */

  const TERRAIN_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNorm;
uniform mat3 uRot;
uniform float uScale;
uniform float uZoom;
out vec3 vNormal;
out float vFacing;
void main() {
  vec3 r = uRot * aPos;
  vNormal = uRot * aNorm;
  vFacing = r.z;
  if (r.z <= -0.01) { gl_Position = vec4(2,2,2,1); return; }
  gl_Position = vec4(r.x * uScale / uZoom, r.y * uScale / uZoom, 0.0, 1.0);
}`;

  const TERRAIN_FS = `#version 300 es
precision highp float;
in vec3 vNormal;
in float vFacing;
uniform vec3 uLightDir;
out vec4 outColor;
void main() {
  vec3 n = normalize(vNormal);
  float diff = max(dot(n, uLightDir), 0.0);
  float light = 0.2 + 0.8 * diff;
  float sh = clamp(0.6 + 0.4 * vFacing, 0.0, 1.0);
  vec3 base = mix(vec3(0.08,0.14,0.06), vec3(0.18,0.28,0.12), diff);
  outColor = vec4(base * light * sh, 1.0);
}`;

  const ENTITY_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
uniform mat3 uRot;
uniform float uScale;
uniform float uZoom;
out float vFacing;
void main() {
  vec3 r = uRot * aPos;
  vFacing = r.z;
  if (r.z <= 0.0) { gl_Position = vec4(2,2,2,1); return; }
  gl_Position = vec4(r.x * uScale / uZoom, r.y * uScale / uZoom, 0.0, 1.0);
}`;

  const ENTITY_FS = `#version 300 es
precision highp float;
in float vFacing;
uniform vec3 uColor;
out vec4 outColor;
void main() {
  float sh = clamp(0.5 + 0.5 * vFacing, 0.0, 1.0);
  outColor = vec4(uColor * sh, 1.0);
}`;

  const LINE_VS = ENTITY_VS;
  const LINE_FS = `#version 300 es
precision highp float;
in float vFacing;
uniform vec3 uColor;
out vec4 outColor;
void main() {
  float sh = clamp(0.5 + 0.5 * vFacing, 0.0, 1.0);
  outColor = vec4(uColor * sh, 1.0);
}`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function linkProg(vsSrc, fsSrc) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
      throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  const terrainProg = linkProg(TERRAIN_VS, TERRAIN_FS);
  const entityProg  = linkProg(ENTITY_VS,  ENTITY_FS);
  const lineProg    = linkProg(LINE_VS,    LINE_FS);

  const U = {};
  [["terrain", terrainProg, ["uRot","uScale","uZoom","uLightDir"]],
   ["entity",  entityProg,  ["uRot","uScale","uZoom","uColor"]],
   ["line",    lineProg,    ["uRot","uScale","uZoom","uColor"]]
  ].forEach(([name, prog, uniforms]) => {
    U[name] = {};
    uniforms.forEach(u => { U[name][u] = gl.getUniformLocation(prog, u); });
  });

  /* =========================================================================
     WORLD DATA (caricato da world_data.json)
     ========================================================================= */
  let worldData;
  try {
    const resp = await fetch("world_data.json");
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    worldData = await resp.json();
  } catch(e) {
    document.body.innerHTML +=
      "<p style='color:#f55;padding:20px'>Impossibile caricare world_data.json: " + e.message + "<br/>Esegui: python -m aethermap.render.webgl_exporter</p>";
    throw e;
  }
  document.getElementById("ent-count").textContent = worldData.entities.length;

  /* =========================================================================
     TERRAIN BUFFERS
     ========================================================================= */
  const tMesh = worldData.terrain;

  const terrainPosBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, terrainPosBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(tMesh.positions), gl.STATIC_DRAW);

  const terrainNormBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, terrainNormBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(tMesh.normals), gl.STATIC_DRAW);

  const terrainIdxBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, terrainIdxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(tMesh.indices), gl.STATIC_DRAW);
  const terrainIdxCount = tMesh.indices.length;

  /* =========================================================================
     ENTITY BUFFERS
     ========================================================================= */
  const entDrawCalls = [];

  (worldData.entities || []).forEach(ent => {
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);

    if (ent.kind === "line") {
      const flat = [];
      for (const p of ent.points) flat.push(p[0], p[1], p[2]);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(flat), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
      entDrawCalls.push({
        vao, count: ent.points.length,
        color: ent.color, mode: gl.LINE_STRIP,
        prog: lineProg, u: U.line
      });
    } else {
      const r = ent.radius || 1.0;
      const phi = (1 + Math.sqrt(5)) / 2;
      let verts = [
        [-1,phi,0],[1,phi,0],[-1,-phi,0],[1,-phi,0],
        [0,-1,phi],[0,1,phi],[0,-1,-phi],[0,1,-phi],
        [phi,0,-1],[phi,0,1],[-phi,0,-1],[-phi,0,1]
      ].map(v => {
        const l = Math.hypot(v[0],v[1],v[2]);
        return [v[0]/l*r, v[1]/l*r, v[2]/l*r];
      });
      for (let s = 0; s < 2; s++) {
        const next = [];
        for (let i = 0; i < verts.length; i++) {
          const a = verts[i];
          const b = verts[(i+1) % verts.length];
          next.push(a);
          next.push([(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2]);
        }
        verts = next;
      }
      const posArr = new Float32Array(verts.length * 3);
      for (let i = 0; i < verts.length; i++) {
        posArr[i*3]=verts[i][0]; posArr[i*3+1]=verts[i][1]; posArr[i*3+2]=verts[i][2];
      }
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, posArr, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
      entDrawCalls.push({
        vao, count: verts.length,
        color: ent.color, mode: gl.TRIANGLES,
        prog: entityProg, u: U.entity
      });
    }
    gl.bindVertexArray(null);
  });

  /* =========================================================================
     CAMERA
     ========================================================================= */
  let yaw   = worldData.camera ? worldData.camera.yaw   : 0.6;
  let pitch = worldData.camera ? worldData.camera.pitch  : 0.35;
  let zoom  = worldData.camera ? worldData.camera.distance : 2.5;
  let dragging = false, lx = 0, ly = 0;

  canvas.addEventListener("pointerdown", e => {
    dragging = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointerup",   () => dragging = false);
  canvas.addEventListener("pointerleave",() => dragging = false);
  canvas.addEventListener("pointermove", e => {
    if (!dragging) return;
    yaw += (e.clientX - lx) * 0.005;
    pitch += (e.clientY - ly) * 0.005;
    pitch = Math.max(-1.4, Math.min(1.4, pitch));
    lx = e.clientX; ly = e.clientY;
  });
  canvas.addEventListener("wheel", e => {
    zoom *= e.deltaY > 0 ? 1.08 : 0.93;
    zoom = Math.max(0.5, Math.min(10.0, zoom));
    e.preventDefault();
  }, { passive: false });

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
  }
  addEventListener("resize", resize);
  resize();

  function rotMat() {
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    return new Float32Array([cy,0,-sy, sy*sp,cp,cy*sp, sy*cp,-sp,cy*cp]);
  }

  /* =========================================================================
     RENDER LOOP
     ========================================================================= */
  const lightDir = (() => {
    const l = Math.hypot(0.3,0.5,0.85);
    return [0.3/l, 0.5/l, 0.85/l];
  })();

  let lastT = performance.now(), frames = 0;

  function frame(now) {
    frames++;
    if (now - lastT >= 1000) {
      document.getElementById("fps").textContent = Math.round(frames * 1000 / (now - lastT));
      frames = 0; lastT = now;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.02, 0.03, 0.06, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    const rot = rotMat();
    const s = 0.85;

    useProg(terrainProg);
    gl.uniformMatrix3fv(U.terrain.uRot, false, rot);
    gl.uniform1f(U.terrain.uScale, s);
    gl.uniform1f(U.terrain.uZoom, zoom);
    gl.uniform3fv(U.terrain.uLightDir, lightDir);
    gl.bindVertexArray(null);
    gl.bindBuffer(gl.ARRAY_BUFFER, terrainPosBuf);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, terrainNormBuf);
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, terrainIdxBuf);
    if (terrainIdxCount > 0) gl.drawElements(gl.TRIANGLES, terrainIdxCount, gl.UNSIGNED_INT, 0);
    gl.disableVertexAttribArray(1);

    entDrawCalls.forEach(dc => {
      useProg(dc.prog);
      gl.uniformMatrix3fv(dc.u.uRot, false, rot);
      gl.uniform1f(dc.u.uScale, s);
      gl.uniform1f(dc.u.uZoom, zoom);
      if (dc.u.uColor) gl.uniform3fv(dc.u.uColor, dc.color);
      gl.bindVertexArray(dc.vao);
      gl.drawArrays(dc.mode, 0, dc.count);
    });

    gl.bindVertexArray(null);
    requestAnimationFrame(frame);
  }

  if (terrainIdxCount > 0) {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
