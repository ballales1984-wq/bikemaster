[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bikemaster"
version = "0.1.0"
description = "GPS-based cycling performance intelligence system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "BikeMaster"}]
keywords = ["cycling", "gps", "fitness", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.10",
    "alembic==1.16.0",
    "asyncpg==0.30.0",
    "aiosqlite==0.20.0",
    "greenlet==3.1.1",
    "python-multipart==0.0.9",
    "pydantic-settings==2.6.0",
    "folium==0.19.7",
    "pandas==2.2.0",
    "numpy==1.26.4",
    "scipy==1.11.4",
    "scikit-learn==1.5.0",
    "statsmodels==0.14.4",
    "matplotlib==3.8.0",
    "pydantic==2.10.0",
    "requests==2.32.0",
    "groq==0.20.0",
    "openai==1.65.0",
    "fitparse==1.2.0",
    "gpxpy==1.6.2",
    "python-dotenv==1.0.1",
    "sentry-sdk==2.24.0",
    "prometheus-fastapi-instrumentator==7.1.0",
    "prometheus-client==0.21.0",
    "slowapi==0.1.9",
    "endurance-metrics==0.1.0",
    "python-jose[cryptography]==3.3.0",
    "passlib==1.7.4",
    "bcrypt==4.1.3",
    "redis==5.2.1",
    "pgvector==0.3.6",
    "chromadb==0.5.22",
    "pytest-asyncio==0.25.3",
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-instrumentation-fastapi==0.49.0",
    "opentelemetry-instrumentation-sqlalchemy==0.39.0",
    "opentelemetry-instrumentation-requests==0.39.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.27.0",
    "opentelemetry-exporter-zipkin-proto-http==1.27.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "B007"]

[tool.ruff.lint.per-file-ignores]
"bike_analyzer/frontend/dashboard.py" = ["E501"]
"bike_analyzer/backend/api/routes.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "comparison-overlap",
    "dict-item",
    "import-untyped",
    "index",
    "misc",
    "no-any-return",
    "no-untyped-call",
    "no-untyped-def",
    "operator",
    "return-value",
    "type-arg",
    "union-attr",
    "untyped-decorator",
    "valid-type",
    "var-annotated",
]

[project.scripts]
bikemaster = "bike_analyzer.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bike_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.pyright]
typeCheckingMode = "basic"
include = ["bike_analyzer", "tests"]
exclude = ["**/.venv", "**/node_modules", "**/__pycache__"]