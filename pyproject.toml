[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bikemaster"
version = "0.1.0"
description = "Lifestyle health intelligence system — health state as dynamic balance of lifestyle variables"
readme = "README.md"
license = {text = "All Rights Reserved"}
requires-python = ">=3.11"
authors = [{name = "BikeMaster"}]
keywords = ["cycling", "gps", "fitness", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "sqlalchemy>=2.0.27,<3.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "greenlet>=3.0.0,<4.0.0",
    "python-multipart>=0.0.18,<1.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "folium>=0.16.0,<1.0.0",
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.26.4,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "statsmodels>=0.14.0,<1.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "requests>=2.31.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "groq>=0.4.0,<1.0.0",
    "fitparse>=1.2.0,<2.0.0",
    "gpxpy>=1.6.2,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "sentry-sdk>=2.0.0,<3.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0,<8.0.0",
    "prometheus-client>=0.20.0,<0.22.0",
    "slowapi>=0.1.9,<1.0.0",
    "google-auth>=2.29.0,<3.0.0",
    "sentence-transformers>=2.2.0,<3.0.0",
    "endurance-metrics>=0.1.0,<1.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib>=1.7.4,<2.0.0",
    "bcrypt>=4.0.0,<4.2.0",
    "redis>=5.0.0,<6.0.0",
    "pgvector>=0.2.0,<1.0.0",
    "chromadb>=0.5.0,<1.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "plotly>=5.22.0,<6.0.0",
    "geopy>=2.4.0,<3.0.0",
    "elevation>=1.1.3,<2.0.0",
    "meteostat>=2.1.0,<3.0.0",
    "networkx>=3.2.0,<4.0.0",
    "sympy>=1.12.0,<2.0.0",
    "joblib>=1.4.0,<2.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "opentelemetry-api>=1.27.0,<2.0.0",
    "opentelemetry-sdk>=1.27.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0,<1.0.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.38.0,<1.0.0",
    "opentelemetry-instrumentation-requests>=0.38.0,<1.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0,<2.0.0",
    "SpeechRecognition>=3.10.0,<4.0.0",
    "pydub>=0.25.0,<1.0.0",
    "edge-tts>=7.0.0,<8.0.0",
]

[project.optional-dependencies]
maps = ["aethermap>=0.1.0"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["alembic/versions/*", ".benchmarks/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
extend-ignore = ["B008", "B007"]

[tool.ruff.lint.per-file-ignores]
"bike_analyzer/frontend/dashboard.py" = ["E501"]
"bike_analyzer/backend/api/routes.py" = ["B008", "E501"]
"bike_analyzer/backend/observability.py" = ["E402"]
"bike_analyzer/backend/ingestion/gps_parser.py" = ["E501", "SIM105"]
"tests/**" = ["B018", "SIM117", "B017", "E402", "E501", "SIM105", "F811", "F841", "F401", "C408", "C401", "B011", "SIM103", "SIM102", "SIM110"]
"aethermap/**" = ["E501"]
"_routes_map.py" = ["E402", "E501", "F841"]
"gpxdiag.py" = ["E402", "E501", "SIM105"]
"kill_all.py" = ["E402", "E501"]
"kill_ruff.py" = ["E402", "E501"]
"read_pyproject.py" = ["E402", "E501"]
"check_proc.py" = ["E402", "E501"]
"check_admin.py" = ["E402", "E501"]
"check_lock.py" = ["E402", "E501"]
"check_db.py" = ["E402", "E501"]
"docs_analyzer.py" = ["E402", "E501"]
"debug_heatmap.py" = ["E402", "E501"]
"audit_gen_token.py" = ["E402", "E501"]
"audit_setup.py" = ["E402", "E501"]
"run_backend_logged.py" = ["E402", "E501"]

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "comparison-overlap",
    "dict-item",
    "import-untyped",
    "index",
    "misc",
    "no-any-return",
    "no-untyped-call",
    "no-untyped-def",
    "operator",
    "return-value",
    "type-arg",
    "union-attr",
    "untyped-decorator",
    "valid-type",
    "var-annotated",
]

[project.scripts]
bikemaster = "bike_analyzer.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bike_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=bike_analyzer --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=json"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
timeout = 60

[tool.pyright]
typeCheckingMode = "basic"
include = ["bike_analyzer", "tests", "aethermap/src"]
exclude = ["**/.venv", "**/node_modules", "**/__pycache__"]