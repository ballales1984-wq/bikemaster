[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bikemaster"
version = "0.1.0"
description = "GPS-based cycling performance intelligence system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "BikeMaster"}]
keywords = ["cycling", "gps", "fitness", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.27",
    "python-multipart>=0.0.18",
    "folium>=0.16.0",
    "pandas>=2.2.0",
    "numpy>=1.26.4",
    "fitparse>=1.2.0",
    "gpxpy>=1.6.2",
    "python-dotenv>=1.0.1",
    "pydantic>=2.0.0",
    "matplotlib>=3.8.0",
    "requests>=2.31.0",
    "groq>=0.4.0",
    "psycopg2-binary>=2.9.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
strict = true

[project.scripts]
bikemaster = "bike_analyzer.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bike_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]