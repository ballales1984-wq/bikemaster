services:
  - type: web
    name: bikemaster-hub
    runtime: python
    plan: free
    region: frankfurt
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bikemaster-hub-db
          property: connectionString
      - key: DATABASE_URL_UNPOOLED
        fromDatabase:
          name: bikemaster-hub-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://bikemaster-xi.vercel.app
      - key: OAUTH_ALLOWED_REDIRECT_HOSTS
        value: bikemaster-xi.vercel.app
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AI_COACH_MODE
        value: external
      - key: LOG_LEVEL
        value: WARNING
      - key: PYTHON_VERSION
        value: "3.11"
    startCommand: python main.py hub --port $PORT
    healthCheckPath: /health
    autoDeploy: true

  - type: postgresql
    name: bikemaster-hub-db
    plan: free
    region: frankfurt
