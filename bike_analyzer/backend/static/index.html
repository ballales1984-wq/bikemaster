<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BikeMaster - Cycling Performance Intelligence Dashboard">
    <title>BikeMaster - Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚴 BikeMaster</h1>
            <p>Cycling Performance Intelligence</p>
        </header>

        <div class="stats" id="stats" role="region" aria-label="Statistiche generali">
            <div class="stat-card" role="status">
                <div class="stat-value" id="total-rides">0</div>
                <div class="stat-label">Rides</div>
            </div>
            <div class="stat-card" role="status">
                <div class="stat-value" id="total-distance">0</div>
                <div class="stat-label">Km Totali</div>
            </div>
            <div class="stat-card" role="status">
                <div class="stat-value" id="total-calories">0</div>
                <div class="stat-label">Calorie</div>
            </div>
            <div class="stat-card" role="status">
                <div class="stat-value" id="avg-speed">0</div>
                <div class="stat-label">Vel Media</div>
            </div>
            <div class="stat-card" role="status">
                <div class="stat-value" id="total-hours">0</div>
                <div class="stat-label">Ore Totali</div>
            </div>
        </div>

        <div class="panel" role="region" aria-labelledby="add-ride-heading">
            <h2 id="add-ride-heading">➕ Aggiungi Nuova Ride</h2>
            <form id="ride-form" class="form-grid" novalidate>
                <div class="form-group">
                    <label for="ride-date">Data</label>
                    <input type="date" id="ride-date" name="date" required aria-required="true">
                    <span class="error-msg" id="error-date" role="alert"></span>
                </div>
                <div class="form-group">
                    <label for="ride-distance">Distanza (km)</label>
                    <input type="number" id="ride-distance" name="distance_km" placeholder="Es: 25.5" step="0.1" min="0" required aria-required="true">
                    <span class="error-msg" id="error-distance" role="alert"></span>
                </div>
                <div class="form-group">
                    <label for="ride-duration">Durata (min)</label>
                    <input type="number" id="ride-duration" name="duration_minutes" placeholder="Es: 60" step="1" min="0" required aria-required="true">
                    <span class="error-msg" id="error-duration" role="alert"></span>
                </div>
                <div class="form-group">
                    <label for="ride-speed">Velocità (km/h)</label>
                    <input type="number" id="ride-speed" name="avg_speed_kmh" placeholder="Es: 22.5" step="0.1" min="0">
                    <span class="error-msg" id="error-speed" role="alert"></span>
                </div>
                <div class="form-group">
                    <label for="ride-calories">Calorie</label>
                    <input type="number" id="ride-calories" name="calories" placeholder="Es: 400" step="1" min="0">
                    <span class="error-msg" id="error-calories" role="alert"></span>
                </div>
                <div class="form-group">
                    <label for="ride-hr">HR medio (bpm)</label>
                    <input type="number" id="ride-hr" name="heart_rate_avg" placeholder="Es: 145" step="1" min="30" max="220">
                    <span class="error-msg" id="error-hr" role="alert"></span>
                </div>
                <div class="form-group">
                    <label for="ride-elevation">Altitudine (m)</label>
                    <input type="number" id="ride-elevation" name="elevation_gain_m" placeholder="Es: 180" step="1" min="0">
                    <span class="error-msg" id="error-elevation" role="alert"></span>
                </div>
            </form>
            <div class="flex">
                <button type="submit" form="ride-form" class="btn btn-primary" id="add-ride-btn">
                    <span class="btn-text">Aggiungi</span>
                    <span class="spinner" aria-hidden="true"></span>
                </button>
                <button type="button" class="btn btn-secondary" id="reset-demo-btn">Reset Demo</button>
            </div>
        </div>

        <div class="panel" role="region" aria-labelledby="chart-heading">
            <h2 id="chart-heading">📊 Durata Ultime Ride</h2>
            <div class="chart-container">
                <canvas id="durationChart" aria-label="Grafico durata ultime 10 ride" role="img"></canvas>
            </div>
        </div>

        <div class="panel" role="region" aria-labelledby="rides-heading">
            <h2 id="rides-heading">📋 Le tue Ride</h2>
            <div class="rides-list" id="rides-list" role="list" aria-label="Lista delle ride">
                <p class="loading-text" id="rides-loading">Caricamento...</p>
            </div>
        </div>

        <div id="map" class="map-container" role="region" aria-label="Mappa del percorso"></div>
    </div>

    <div id="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
