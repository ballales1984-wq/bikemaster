[package]
name = "bikemaster-desktop"
version = "1.0.0"
description = "BikeMaster desktop (SQLite locale + backend su PC)"
authors = ["BikeMaster"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bikemaster_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
