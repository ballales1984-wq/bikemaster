[package]
name = "bikemaster-desktop"
version = "1.0.0"
description = "BikeMaster desktop (SQLite locale + backend Axum embedded)"
authors = ["BikeMaster"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bikemaster_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["default"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
btleplug = "0.12"
futures = "0.3"
axum = { version = "0.8", features = ["json", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
bcrypt = "0.15"
jsonwebtoken = "9"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.19", features = ["invocation"] }
