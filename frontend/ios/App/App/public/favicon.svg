<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="12" fill="#181a1b"/>
  <!-- Rear wheel -->
  <circle cx="18" cy="44" r="12" stroke="#4ecca3" stroke-width="2.5" fill="none"/>
  <circle cx="18" cy="44" r="3" fill="#4ecca3"/>
  <!-- Front wheel -->
  <circle cx="46" cy="44" r="12" stroke="#4ecca3" stroke-width="2.5" fill="none"/>
  <circle cx="46" cy="44" r="3" fill="#4ecca3"/>
  <!-- Frame -->
  <path d="M18 44 L30 24 L46 44" stroke="#4ecca3" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
  <path d="M30 24 L46 44" stroke="#00b4d8" stroke-width="2" fill="none"/>
  <path d="M30 24 L38 32" stroke="#00b4d8" stroke-width="2" stroke-linecap="round"/>
  <!-- Seat -->
  <path d="M25 24 L35 24" stroke="#4ecca3" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Handlebars -->
  <path d="M42 30 L50 28" stroke="#4ecca3" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Speed trail -->
  <line x1="2" y1="35" x2="12" y2="35" stroke="#4ecca3" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="4" y1="40" x2="11" y2="40" stroke="#4ecca3" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
</svg>