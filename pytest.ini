[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
addopts = -ra -m "not slow and not missing_greenlet" --timeout=30
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    missing_greenlet: skip on environments without async greenlet support
    slow: marks tests as slow (deselect with -m "not slow")
