[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
addopts = -ra -m "not slow and not missing_greenlet and not integration" --timeout=120 --timeout-method=thread
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    missing_greenlet: skip on environments without async greenlet support
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks tests that require external services (PostgreSQL/Redis)
