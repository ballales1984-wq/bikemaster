[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
addopts = -ra --ignore=tests/test_ai_coach_helpers.py --ignore=tests/test_athlete_state_integration.py -m "not slow" --timeout=30
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    missing_greenlet: skip on environments without async greenlet support
    slow: marks tests as slow (deselect with -m "not slow")
