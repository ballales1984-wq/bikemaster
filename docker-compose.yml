version: '3.8'

services:
  bikemaster:
    build: .
    container_name: bikemaster-app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./bike_analyzer/backend/static:/app/bike_analyzer/backend/static
      - ./rides.db:/app/rides.db
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl","-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  data:
  static:
