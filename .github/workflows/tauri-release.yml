name: Tauri Desktop Release

# Builds the BikeMaster Tauri 2 desktop app for Windows (.exe), macOS (.dmg)
# and Linux (.AppImage) and publishes them to GitHub Releases.
#
# Triggers:
#   - push to main / master  -> continuous "nightly" release
#   - push of a tag (v*)      -> versioned prerelease release
#   - manual workflow_dispatch
#
# Builds only run after the backend + frontend test/lint/typecheck jobs pass.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- Backend (Python) tests -------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pip install pytest-cov pytest-asyncio
      - run: pytest tests/ --cov=bike_analyzer --cov-report=term

  # ---- Frontend (Vue/Vite) lint, typecheck, unit tests, build ----------------
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build

  # ---- Desktop builds (matrix of Windows / macOS / Linux) ---------------------
  tauri-build:
    needs: [test-backend, test-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Linux needs WebKit + appindicator dev libraries for Tauri bundling.
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # Install frontend deps so tauri-action's beforeBuildCommand (npm run build)
      # can produce the dist bundle inside frontend/.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # tauri-action builds the Rust + WebView app and uploads the resulting
      # artifacts (.exe / .msi on Windows, .dmg / .app on macOS, .AppImage / .deb
      # on Linux) to the GitHub Release automatically.
      - name: Build Tauri app and publish to GitHub Releases
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Optional macOS code signing / notarization ---
          # Leave empty to skip signing (unsigned .dmg still builds).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: frontend
          # Continuous release on main, versioned release on tags.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Nightly Build' }}
          releaseBody: 'Automated desktop build of BikeMaster for Windows, macOS and Linux.'
          releaseDraft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          # Build a universal macOS binary so a single .dmg covers both arches.
          args: ${{ matrix.platform == 'macos' && '--target universal-apple-darwin' || '' }}
