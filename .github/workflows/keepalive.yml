name: Keep Render warm

# Pings the health endpoint on a schedule so the free-tier Render web service
# does not spin down (which causes the 503 cold-start errors on first visit).
on:
  schedule:
    # Every 10 minutes (Render free instances sleep after ~15 min idle).
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: https://bikemaster.onrender.com/api/v1/health
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -m 60 -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            echo "Attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Service is warm."
              exit 0
            fi
            sleep 30
          done
          echo "::warning::Service did not return 200 after wake attempts."
