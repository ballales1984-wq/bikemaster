services:
  - type: web
    name: bikemaster-api
    runtime: python
    buildCommand: cd frontend && npm install && npm run build && cp -r dist/* ../bike_analyzer/backend/static/ && cd .. && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python main.py api --port $PORT
    envVars:
      - key: PORT
        value: "8000"
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false  # Set via Render dashboard
      - key: AI_COACH_MODE
        value: external
      - key: AI_COACH_PROVIDER_ORDER
        value: groq,openai
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: bikemaster-db
          property: connectionString

  - type: postgresql
    name: bikemaster-db
    plan: starter