services:
  - type: web
    name: bikemaster-api
    runtime: python
    buildCommand: cd frontend && npm install && npm run build && cd .. && find bike_analyzer/backend/static -maxdepth 2 -type f \( -name 'index.html' -o -name 'registerSW.js' -o -name 'sw.js' -o -name 'manifest.json' -o -name 'manifest.webmanifest' -o -name '*.png' -o -name '*.svg' -o -path '*/assets/*' \) -delete && cp -r frontend/dist/. bike_analyzer/backend/static/ && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python main.py api --port $PORT
    envVars:
      - key: PORT
        value: "8000"
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false  # Set via Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false  # Set via Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false  # Set via Render dashboard
      - key: AI_COACH_MODE
        value: external
      - key: AI_COACH_PROVIDER_ORDER
        value: groq,openai
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: bikemaster-db
          property: connectionString

  - type: postgresql
    name: bikemaster-db
    plan: starter