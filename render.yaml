services:
  - type: web
    name: bikemaster-api
    runtime: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_REDIRECT_URI
         value: https://bikemaster.onrender.com/api/v1/import/strava/callback
      - key: AI_COACH_MODE
        value: external
      - key: AI_COACH_PROVIDER_ORDER
        value: groq
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: bikemaster-db
          property: connectionString
      - key: LOG_LEVEL
        value: WARNING
    startCommand: sh -c "python main.py api --port $PORT"
    healthCheckPath: /api/v1/health
    autoDeploy: true

  - type: postgresql
    name: bikemaster-db
    plan: starter