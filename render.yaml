services:
  - type: web
    name: bikemaster-api
    runtime: python
    buildCommand: cd frontend && npm install && npm run build && cp -r dist/* ../bike_analyzer/backend/static/ && cd .. && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python main.py api --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: bikemaster-db
          property: connectionString

  - type: postgresql
    name: bikemaster-db
    plan: starter