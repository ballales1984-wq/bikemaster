services:
  - type: web
    name: bikemaster-api
    runtime: python
    buildCommand: cd frontend && npm install && npm run build && cd .. && rm -rf bike_analyzer/backend/static && mkdir -p bike_analyzer/backend/static && cp -r frontend/dist/. bike_analyzer/backend/static/ && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python main.py api --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AI_COACH_MODE
        value: external
      - key: AI_COACH_PROVIDER_ORDER
        value: groq,openai
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: bikemaster-db
          property: connectionString

  - type: postgresql
    name: bikemaster-db
    plan: starter