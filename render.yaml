services:
  - type: web
    name: bikemaster-api
    runtime: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_REDIRECT_URI
        value: https://bikemaster.onrender.com/api/v1/import/strava/callback
      - key: AI_COACH_MODE
        value: external
      - key: AI_COACH_PROVIDER_ORDER
        value: groq
      - key: CORS_ORIGINS
        value: https://bikemaster-xi.vercel.app,http://localhost:8000,http://localhost:8080,http://127.0.0.1:8000
      - key: OAUTH_ALLOWED_REDIRECT_HOSTS
        value: bikemaster.onrender.com,bikemaster-xi.vercel.app
      - key: SERVE_STATIC
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: bikemaster-db
          property: connectionString
      - key: LOG_LEVEL
        value: WARNING
      - key: ENVIRONMENT
        value: production
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "0"
    startCommand: python main.py api --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true

  - type: postgresql
    name: bikemaster-db
    plan: starter
