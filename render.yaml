services:
  - type: web
    name: bikemaster-api
    runtime: docker
    plan: free
    port: 10000
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_REDIRECT_URI
        value: https://bikemaster.onrender.com/api/v1/import/strava/callback
      - key: AI_COACH_MODE
        value: external
      - key: AI_COACH_PROVIDER_ORDER
        value: groq
      - key: CORS_ORIGINS
        value: https://bikemaster-xi.vercel.app,http://localhost:8000,http://localhost:8080,http://localhost:5173,http://127.0.0.1:8000
      - key: OAUTH_ALLOWED_REDIRECT_HOSTS
        value: bikemaster.onrender.com,bikemaster-xi.vercel.app
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: bikemaster-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: bikemaster-redis
          property: connectionString
      - key: LOG_LEVEL
        value: WARNING
      - key: STARTUP_TASK_TIMEOUT
        value: "30"
      - key: SHUTDOWN_TIMEOUT_SECONDS
        value: "25"
      - key: ENVIRONMENT
        value: production
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "1"
      - key: OTEL_EXPORTER_ZIPKIN_ENDPOINT
        value: ""
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: ""
      - key: SERVE_STATIC
        value: "true"
    startCommand: bash scripts/start.sh
    healthCheckPath: /api/v1/health
    startupTimeout: 120
    maxShutdownDelaySeconds: 60
    autoDeploy: true

  - type: postgresql
    name: bikemaster-db
    plan: starter

  - type: redis
    name: bikemaster-redis
    plan: free
